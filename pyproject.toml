[project]
name = "deepagents-monty"
version = "0.1.0"
description = "Monty-backed execute_python middleware for Deep Agents, with a shared filesystem between the sandbox and the agent's file tools."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Yesh Chandiramani" }]
keywords = [
    "llm",
    "agents",
    "langchain",
    "langgraph",
    "deepagents",
    "pydantic",
    "monty",
    "sandbox",
    "code-execution",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic-monty>=0.0.11",
    "deepagents>=0.5.3",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langgraph>=1.0.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/yesh0907/deepagents-monty"
Issues = "https://github.com/yesh0907/deepagents-monty/issues"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/deepagents_monty/tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line-too-long handled by formatter
]
